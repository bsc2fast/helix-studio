<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Helix Studio: a laser beam coming down onto the stock, a double helix
       of burn across it — dark navy tile, as the app bar -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2438"/><stop offset="1" stop-color="#0a0e18"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b4a" stop-opacity="0"/><stop offset="1" stop-color="#ffb454"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff4d6"/><stop offset=".35" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#ff6b4a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <path d="M64 330 C 128 230, 192 230, 256 330 S 384 430, 448 330" fill="none" stroke="#6aa8ff" stroke-width="30" stroke-linecap="round"/>
  <path d="M64 330 C 128 430, 192 430, 256 330 S 384 230, 448 330" fill="none" stroke="#3ee0d0" stroke-width="30" stroke-linecap="round"/>
  <rect x="244" y="70" width="24" height="250" rx="12" fill="url(#beam)"/>
  <circle cx="256" cy="330" r="62" fill="url(#glow)"/>
  <circle cx="256" cy="330" r="17" fill="#fff8e8"/>
</svg>
