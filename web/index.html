<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Helix Studio</title>
<style>
  :root{
    --bg:#14151a; --panel:#1d1f27; --panel2:#262933; --line:#333644;
    --ink:#e8e9ee; --muted:#9297a8; --accent:#7bd88f; --accent2:#6aa8ff;
    --danger:#ff6b6b; --bed:#0c0d11; --bedline:#3a3f50; --shadow:0 6px 24px rgba(0,0,0,.35);
  }
  html[data-theme="light"]{
    --bg:#f4f6f9; --panel:#ffffff; --panel2:#eceff4; --line:#d6dae2;
    --ink:#1a1c22; --muted:#5b6274; --accent:#1f9d4d; --accent2:#2f6fed;
    --danger:#d23b3b; --bed:#e7eaf0; --bedline:#b9c0cc; --shadow:0 6px 20px rgba(20,30,60,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column}

  /* ---- app bar ---- */
  header{display:flex;align-items:center;gap:14px;padding:9px 16px;
    background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{font-size:15px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
  .brand span{color:var(--muted);font-weight:400}
  .pill{font-size:12px;color:var(--muted);background:var(--panel2);
    border:1px solid var(--line);border-radius:20px;padding:4px 11px;white-space:nowrap}
  .pill b{color:var(--accent)}
  .spacer{flex:1}
  .matbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .presets{display:flex;gap:6px;flex-wrap:wrap;max-width:52vw}
  .chip{font-size:11px;color:var(--muted);background:var(--panel2);
    border:1px solid var(--line);border-radius:6px;padding:3px 8px;white-space:nowrap}
  .chip b{color:var(--ink);font-weight:600}
  select,input[type=number],input[type=text]{background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:6px;padding:6px 9px;font:inherit}
  input[type=number]{width:70px}
  .icon{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);cursor:pointer;font-size:16px;line-height:1;
    display:inline-flex;align-items:center;justify-content:center}
  .icon:hover{border-color:var(--accent2)}
  .reset{color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline}

  /* ---- layout ---- */
  main{flex:1;display:flex;overflow:hidden}
  .left{flex:1;padding:22px;overflow:auto;display:flex;align-items:flex-start;justify-content:center}
  .right{width:420px;flex-shrink:0;border-left:1px solid var(--line);
    background:var(--panel);padding:18px;overflow:auto}
  section{margin-bottom:22px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 10px}

  .drop{border:2px dashed var(--line);border-radius:12px;padding:60px 30px;text-align:center;
    color:var(--muted);width:100%;max-width:520px;cursor:pointer}
  .drop.hot{border-color:var(--accent2);color:var(--ink)}
  .stage{position:relative;background:
    repeating-conic-gradient(var(--panel2) 0 25%, var(--panel) 0 50%) 50%/28px 28px;
    border:1px solid var(--line);border-radius:10px;padding:16px;display:none}
  .stage.on{display:block}
  .stage img{display:block;max-width:100%;max-height:74vh;background:#fff;border-radius:4px}

  /* ---- bed ---- */
  #bed{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bed);
    touch-action:none;user-select:none;display:block}
  #bed .art{cursor:grab}
  #bed .art.drag{cursor:grabbing}
  .placeRow{display:flex;align-items:flex-end;gap:10px;margin-top:12px;flex-wrap:wrap}
  .fld{display:flex;flex-direction:column;gap:3px}
  .fld label{font-size:11px;color:var(--muted)}
  button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);padding:8px 12px}
  button:hover{border-color:var(--accent2)}
  .placeInfo{font-size:12px;color:var(--muted);margin:10px 0 0}
  .warn{color:var(--danger);font-size:12px;margin:6px 0 0}

  .layer{border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:10px;background:var(--panel2)}
  .layer .top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .swatch{width:22px;height:22px;border-radius:5px;border:1px solid #0006;flex-shrink:0}
  .layer .cov{font-size:11px;color:var(--muted)}
  .layer select{width:100%}
  .grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .grid4 input{width:100%}
  .grid4 label{font-size:11px;color:var(--muted);display:block;margin-bottom:2px}
  .layer.ignored{opacity:.5}

  .hostRow{display:flex;align-items:center;gap:10px;margin-bottom:10px;color:var(--muted);font-size:13px}
  .hostRow input[type=text]{flex:1}
  .toggle{display:inline-flex;align-items:center;gap:6px}
  .send{width:100%;background:var(--accent2);color:#fff;border-color:var(--accent2);
    font-weight:600;padding:12px;font-size:15px}
  .send:disabled{opacity:.45;cursor:not-allowed}
  .out{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:12px;
    background:var(--bed);border:1px solid var(--line);border-radius:8px;padding:10px;
    margin-top:10px;max-height:170px;overflow:auto;display:none}
  .out.on{display:block}
  .hint{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <div class="brand">Helix Studio <span>· PDF → laser</span></div>
  <span class="pill" id="laserPill">laser —</span>
  <div class="matbar">
    <select id="material"><option value="">— material —</option></select>
    <div class="presets" id="presets"></div>
  </div>
  <div class="spacer"></div>
  <span class="pill" id="pagePill" hidden></span>
  <button class="icon" id="themeBtn" title="Toggle light / dark">☀</button>
  <a class="reset" id="resetBtn" hidden>start over</a>
</header>

<main>
  <div class="left">
    <div class="drop" id="drop">
      <p style="font-size:16px;margin:0 0 6px">Drop a PDF here</p>
      <p class="hint" style="margin:0">or click to choose · your coaster / panel artwork</p>
      <input type="file" id="file" accept="application/pdf" hidden />
    </div>
    <div class="stage" id="stage"><img id="preview" alt="artwork preview" /></div>
  </div>

  <div class="right">
    <section id="bedSection" hidden>
      <h2>Bed placement — drag to move</h2>
      <svg id="bed" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="placeRow">
        <div class="fld"><label>X (mm)</label><input type="number" id="offx" value="0" step="1"></div>
        <div class="fld"><label>Y (mm)</label><input type="number" id="offy" value="0" step="1"></div>
        <button id="rotateBtn" title="Rotate 90°">⟳ Rotate <span id="rotLbl">0°</span></button>
        <button id="centerBtn" title="Center on bed">Center</button>
      </div>
      <p class="placeInfo" id="placeInfo"></p>
      <p class="warn" id="boundsWarn" hidden></p>
    </section>

    <section id="layersSection" hidden>
      <h2>Layers (by colour)</h2>
      <div id="layers"></div>
    </section>

    <section id="sendSection" hidden>
      <div class="hostRow">
        <span>laser</span><input type="text" id="host">
        <label class="toggle"><input type="checkbox" id="autofocus"> autofocus</label>
      </div>
      <button class="send" id="sendBtn">Send to laser</button>
      <p class="hint" style="margin:8px 0 0">Jobs queue on the laser; press <b>GO</b> on the machine to run.</p>
      <div class="out" id="out"></div>
    </section>
  </div>
</main>

<script src="/app.js"></script>
</body>
</html>
