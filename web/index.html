<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Helix Studio</title>
<style>
  :root{
    --bg:#14151a; --panel:#1d1f27; --panel2:#262933; --line:#333644;
    --ink:#e8e9ee; --muted:#9297a8; --accent:#7bd88f; --accent2:#6aa8ff;
    --danger:#ff6b6b; --warn:#ffb454; --bed:#0c0d11; --bedline:#3a3f50;
    --bar:#0f1420; --barline:#2a3040; --shadow:0 10px 34px rgba(0,0,0,.45);
  }
  html[data-theme="light"]{
    --bg:#eef1f5; --panel:#ffffff; --panel2:#eceff4; --line:#d6dae2;
    --ink:#1a1c22; --muted:#5b6274; --accent:#1f9d4d; --accent2:#2f6fed;
    --danger:#d23b3b; --warn:#c77d15; --bed:#dfe3ea; --bedline:#b0b8c6;
    --bar:#e7edf9; --barline:#cdd6e6; --shadow:0 10px 30px rgba(20,30,60,.16);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  [hidden]{display:none!important}
  body{background:var(--bg);color:var(--ink);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;overflow:hidden}

  /* ---- app bar ---- */
  header{display:flex;align-items:center;gap:9px;padding:8px 14px;
    background:var(--bar);border-bottom:1px solid var(--barline);flex-wrap:nowrap;
    overflow:hidden;z-index:3}
  .brand{font-size:15px;font-weight:600;letter-spacing:.3px;white-space:nowrap;
    cursor:pointer;flex-shrink:0}
  .pill{font-size:12px;color:var(--muted);background:var(--panel2);
    border:1px solid var(--line);border-radius:20px;padding:4px 11px;white-space:nowrap;flex-shrink:0}
  .pill b{color:var(--accent)}
  .spacer{flex:1;min-width:8px}
  header select,input[type=number],input[type=text]{background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:7px;padding:6px 9px;font:inherit;flex-shrink:0}
  /* widths are measured from the option text in app.js (fitBar) and set as the
     flex basis; these are only the fallback + the floor they shrink to when the
     window is too narrow for everything at its natural width */
  header select{font-size:13px;flex:0 1 auto;min-width:72px;
    text-overflow:ellipsis;max-width:340px}
  input[type=number]{width:78px}
  .icon{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);cursor:pointer;font-size:16px;line-height:1;
    display:inline-flex;align-items:center;justify-content:center}
  .icon:hover{border-color:var(--accent2)}
  .reset{color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline}
  .send{background:var(--accent2);color:#fff;border:1px solid var(--accent2);
    border-radius:8px;font-weight:600;padding:8px 20px;font-size:14px;cursor:pointer}
  .send:hover{filter:brightness(1.06)}
  .send:disabled{opacity:.4;cursor:not-allowed}

  /* ---- bed canvas ---- */
  main{flex:1;position:relative;display:flex;min-height:0}
  .bedwrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
    padding:24px;min-width:0}
  #bed{background:var(--bed);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);touch-action:none;user-select:none;display:block}
  #bed .art{cursor:grab}
  #bed .art.drag{cursor:grabbing}

  .drop{position:absolute;inset:24px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;cursor:pointer;border-radius:12px;color:var(--muted)}
  .drop .box{border:2px dashed var(--line);border-radius:14px;padding:56px 48px;text-align:center;
    background:color-mix(in srgb, var(--panel) 55%, transparent)}
  .drop.hot .box{border-color:var(--accent2);color:var(--ink)}
  .drop .big{font-size:18px;color:var(--ink);margin:0 0 6px}
  .hint{color:var(--muted);font-size:12px}

  /* ---- floating controls (bottom-right) ---- */
  .floating{position:absolute;right:18px;bottom:18px;width:216px;
    max-height:calc(100% - 36px);overflow:auto;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;z-index:2}
  .floating h2{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 8px}
  .floating section{margin-bottom:16px}
  .floating section:last-child{margin-bottom:0}
  .fld{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
  .fld label{font-size:11px;color:var(--muted)}
  .fld input{width:100%}
  button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);padding:8px 12px}
  button:hover{border-color:var(--accent2)}
  #placeSection button{display:block;width:100%;margin-top:8px}
  .placeInfo{font-size:11.5px;color:var(--muted);margin:10px 0 0;line-height:1.45}
  .warn{color:var(--danger);font-size:12px;margin:6px 0 0}

  .layer{border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;background:var(--panel2)}
  .layer .top{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .swatch{width:20px;height:20px;border-radius:5px;border:1px solid #0006;flex-shrink:0}
  .layer .cov{font-size:11px;color:var(--muted)}
  .layer select{width:100%}
  .grid4{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
  .grid4 input{width:100%}
  .grid4 label{font-size:11px;color:var(--muted);display:block;margin-bottom:2px}
  .layer.ignored{opacity:.5}
  .out{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:12px;
    background:var(--bed);border:1px solid var(--line);border-radius:8px;padding:9px;
    margin-top:4px;max-height:150px;overflow:auto;display:none}
  .out.on{display:block}
</style>
</head>
<body>
<header>
  <div class="brand" id="brand" title="Start over (load a new PDF)">Helix Studio</div>
  <span class="pill" id="laserPill">laser —</span>
  <select id="machine" title="Machine model"></select>
  <select id="material"><option value="">— material —</option></select>
  <select id="thickness" title="Material thickness">
    <option value="">— thickness —</option>
    <option value="1">1 mm</option>
    <option value="2">2 mm</option>
    <option value="3">3 mm</option>
    <option value="4">4 mm</option>
    <option value="5">5 mm</option>
    <option value="6">6 mm</option>
    <option value="8">8 mm</option>
    <option value="10">10 mm</option>
    <option value="12">12 mm</option>
  </select>
  <select id="preset" disabled><option value="">— preset —</option></select>
  <button class="send" id="sendBtn" disabled>Send</button>
  <div class="spacer"></div>
  <button class="icon" id="themeBtn" title="Toggle light / dark">☀</button>
</header>

<main>
  <div class="bedwrap">
    <svg id="bed" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="drop" id="drop">
      <div class="box">
        <p class="big">Drop a PDF here</p>
        <p class="hint">or click to choose · your coaster / panel artwork</p>
      </div>
      <input type="file" id="file" accept="application/pdf" hidden />
    </div>
  </div>

  <div class="floating" id="controls" hidden>
    <section id="placeSection">
      <h2>Placement</h2>
      <div class="fld"><label>X (mm)</label><input type="number" id="offx" value="0" step="1"></div>
      <div class="fld"><label>Y (mm)</label><input type="number" id="offy" value="0" step="1"></div>
      <button id="rotateBtn" title="Rotate 90°">⟳ Rotate <span id="rotLbl">0°</span></button>
      <button id="centerBtn">Center</button>
      <p class="placeInfo" id="placeInfo"></p>
      <p class="warn" id="boundsWarn" hidden></p>
    </section>
    <div class="out" id="out"></div>
  </div>
</main>

<script src="/app.js"></script>
</body>
</html>
