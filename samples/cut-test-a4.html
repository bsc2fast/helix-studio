<!doctype html>
<!--
  Source of cut-test-a4.pdf — a 5-page A4 cut test for multi-page layout.
  Regenerate (vector PDF, exact mm) with headless Chrome:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --no-pdf-header-footer --print-to-pdf=samples/cut-test-a4.pdf \
      "file://$PWD/samples/cut-test-a4.html"

  Every page: red 0.1 mm hairline, cut-only. No text (text would be cut too).
  - Page N has N holes of Ø4 mm, so each cut piece says which page it came from.
  - The holes sit in the shape's top-left corner, so a rotated piece shows it.
  - Each shape has a known size to check with calipers (listed per page below).
  - Each sits at a different spot on its page, to exercise cropping to the ink.
-->
<html><head><meta charset="utf-8"><title>Helix Studio cut test</title>
<style>
  @page { size: 210mm 297mm; margin: 0 }
  html, body { margin: 0 }
  .pg { width: 210mm; height: 297mm; position: relative; overflow: hidden; page-break-after: always }
  .pg:last-child { page-break-after: auto }
  svg { position: absolute; overflow: visible }
  svg * { fill: none; stroke: #f00; stroke-width: 0.1 }
</style></head>
<body>

<!-- 1: square 50 × 50 mm, 1 hole — top-left of the page -->
<div class="pg"><svg style="left:20mm; top:20mm" width="50mm" height="50mm" viewBox="0 0 50 50">
  <rect x="0" y="0" width="50" height="50"/>
  <circle cx="8" cy="8" r="2"/>
</svg></div>

<!-- 2: circle Ø 60 mm, 2 holes — page centre -->
<div class="pg"><svg style="left:75mm; top:118.5mm" width="60mm" height="60mm" viewBox="0 0 60 60">
  <circle cx="30" cy="30" r="30"/>
  <circle cx="16" cy="16" r="2"/><circle cx="24" cy="16" r="2"/>
</svg></div>

<!-- 3: rounded rectangle 80 × 40 mm (r 5), 3 holes — bottom-right of the page -->
<div class="pg"><svg style="left:110mm; top:237mm" width="80mm" height="40mm" viewBox="0 0 80 40">
  <rect x="0" y="0" width="80" height="40" rx="5" ry="5"/>
  <circle cx="9" cy="9" r="2"/><circle cx="17" cy="9" r="2"/><circle cx="25" cy="9" r="2"/>
</svg></div>

<!-- 4: hexagon 70 mm across the points (60.6 mm across the flats), 4 holes — top-right -->
<div class="pg"><svg style="left:120mm; top:25mm" width="70mm" height="60.622mm" viewBox="0 0 70 60.622">
  <polygon points="17.5,0 52.5,0 70,30.311 52.5,60.622 17.5,60.622 0,30.311"/>
  <circle cx="21" cy="8" r="2"/><circle cx="29" cy="8" r="2"/>
  <circle cx="37" cy="8" r="2"/><circle cx="45" cy="8" r="2"/>
</svg></div>

<!-- 5: L-shape 60 × 60 mm, arms 25 mm wide, 5 holes — bottom-left.
     Asymmetric, so 90° / 180° / 270° placements are unmistakable. -->
<div class="pg"><svg style="left:25mm; top:200mm" width="60mm" height="60mm" viewBox="0 0 60 60">
  <polygon points="0,0 25,0 25,35 60,35 60,60 0,60"/>
  <circle cx="7" cy="7" r="2"/><circle cx="15" cy="7" r="2"/>
  <circle cx="7" cy="15" r="2"/><circle cx="15" cy="15" r="2"/><circle cx="11" cy="23" r="2"/>
</svg></div>

</body></html>
